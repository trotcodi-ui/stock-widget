<div>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

#sd-root * { box-sizing: border-box; margin: 0; padding: 0; }
#sd-root {
  font-family: 'Noto Sans KR', sans-serif;
  max-width: 860px;
  margin: 0 auto;
}

/* 티커 */
#sd-ticker-wrap {
  background: #1a0533;
  color: #bb86fc;
  padding: 12px 0;
  overflow: hidden;
  white-space: nowrap;
  border-radius: 12px;
  margin-bottom: 24px;
}
#sd-ticker-inner {
  display: inline-block;
  animation: sd-scroll 30s linear infinite;
  font-size: 14px;
  font-weight: 700;
}
#sd-ticker-wrap:hover #sd-ticker-inner { animation-play-state: paused; }
#sd-ticker-inner span { margin-right: 50px; }
.sd-up { color: #fc8181; }
.sd-dn { color: #90cdf4; }
@keyframes sd-scroll { 0%{transform:translateX(100%)} 100%{transform:translateX(-100%)} }

/* 헤더 */
.sd-header {
  text-align: center;
  padding: 20px 0 16px;
}
.sd-header h2 {
  font-size: 22px;
  font-weight: 900;
  color: #4a148c;
  margin-bottom: 6px;
}
.sd-header p {
  font-size: 13px;
  color: #999;
}

/* 섹션 */
.sd-section {
  background: #f9f4ff;
  border: 1px solid #e1d5f5;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
}
.sd-section-title {
  font-size: 14px;
  font-weight: 700;
  color: #6a1b9a;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e1d5f5;
}

/* 지수/환율 카드 그리드 */
.sd-index-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
}
.sd-index-card {
  background: #fff;
  border: 1px solid #e1d5f5;
  border-radius: 12px;
  padding: 16px 12px;
  text-align: center;
  transition: 0.2s;
}
.sd-index-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 18px rgba(106,27,154,0.1);
  border-color: #6a1b9a;
}
.sd-index-label { font-size: 12px; color: #999; font-weight: 700; margin-bottom: 8px; }
.sd-index-price { font-size: 20px; font-weight: 900; color: #2d3748; margin-bottom: 4px; }
.sd-index-change { font-size: 13px; font-weight: 700; }

/* 종목 리스트 */
.sd-stock-list { display: flex; flex-direction: column; gap: 8px; }
.sd-stock-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #fff;
  border: 1px solid #e1d5f5;
  border-radius: 10px;
  padding: 12px 16px;
  transition: 0.2s;
}
.sd-stock-row:hover { border-color: #6a1b9a; }
.sd-stock-name { font-size: 14px; font-weight: 700; color: #2d3748; }
.sd-stock-code { font-size: 11px; color: #aaa; margin-top: 2px; }
.sd-stock-right { text-align: right; }
.sd-stock-price { font-size: 16px; font-weight: 900; color: #2d3748; }
.sd-stock-change { font-size: 12px; font-weight: 700; margin-top: 2px; }

/* 업데이트 시간 */
.sd-update {
  text-align: center;
  font-size: 11px;
  color: #bbb;
  margin-top: 8px;
  padding-bottom: 10px;
}

/* 즐겨찾기 버튼 */
.sd-bookmark {
  text-align: center;
  margin: 20px 0 10px;
}
.sd-bookmark button {
  padding: 14px 32px;
  background: #6a1b9a;
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: 0.2s;
  box-shadow: 0 4px 14px rgba(106,27,154,0.25);
}
.sd-bookmark button:hover { background: #4a148c; transform: translateY(-2px); }

/* 로딩/에러 */
.sd-loading { text-align: center; color: #aaa; font-size: 14px; padding: 20px 0; }
.sd-error { text-align: center; color: #e53e3e; font-size: 13px; padding: 12px; background: #fff5f5; border-radius: 8px; }

@media (max-width: 480px) {
  .sd-index-grid { grid-template-columns: repeat(2, 1fr); }
  .sd-index-price { font-size: 17px; }
  .sd-header h2 { font-size: 18px; }
}
</style>
</div>
<div id="sd-root"><!-- 티커 -->
<div id="sd-ticker-wrap">
<div id="sd-ticker-inner">데이터 불러오는 중...</div>
</div>
<!-- 헤더 -->
<div class="sd-header">
<h2 data-ke-size="size26">📈 실시간 증시 대시보드</h2>
<p id="sd-update-time" data-ke-size="size16">데이터 로딩 중...</p>
</div>
<!-- 지수 · 환율 -->
<div class="sd-section">
<div class="sd-section-title">🌏 주요 지수 &middot; 환율</div>
<div id="sd-index-grid" class="sd-index-grid">
<div class="sd-loading">불러오는 중...</div>
</div>
</div>
<!-- 주목 종목 -->
<div class="sd-section">
<div class="sd-section-title">🔥 오늘의 주목 종목</div>
<div id="sd-stock-list" class="sd-stock-list">
<div class="sd-loading">불러오는 중...</div>
</div>
</div>
<!-- 즐겨찾기 버튼 -->
<div class="sd-bookmark"><button>⭐ 이 페이지 즐겨찾기 (Ctrl+D)</button></div>
</div>
<script>
(function(){
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSRrlsubfKWAQOGWuWLGhxNetMVgmVAjwT7BrA6Tb6IdGdXeRh3GxHAZU4IJ6cG-s1Vp70zlT6Mlze/pub?output=csv';

  const INDEX_NAMES = ['코스피', '나스닥100', '달러/원'];
  const INDEX_UNITS = { '코스피':'', '나스닥100':'', '달러/원':'원' };

  function fmt(n, decimals) {
    if (!n || isNaN(n)) return 'N/A';
    return Number(n).toLocaleString('ko-KR', { maximumFractionDigits: decimals ?? 2 });
  }

  function changeHtml(change, pct) {
    if (!change || isNaN(change)) return '<span style="color:#aaa">-</span>';
    const up = parseFloat(change) >= 0;
    const arrow = up ? '▲' : '▼';
    const cls = up ? 'sd-up' : 'sd-dn';
    return `<span class="${cls}">${arrow} ${fmt(Math.abs(change))} (${fmt(Math.abs(pct))}%)</span>`;
  }

  async function loadData() {
    try {
      const res = await fetch(SHEET_URL + '&t=' + Date.now());
      const csv = await res.text();
      const rows = csv.trim().split('\n').slice(1).filter(r => r.trim());

      const data = rows.map(row => {
        const cols = row.split(',');
        return {
          name: cols[0]?.trim(),
          price: parseFloat(cols[1]),
          change: parseFloat(cols[2]),
          pct: parseFloat(cols[3]),
          time: cols[4]?.trim(),
          type: cols[5]?.trim()
        };
      });

      if (!data.length) throw new Error('데이터 없음');

      const updateTime = data[0]?.time || '';
      document.getElementById('sd-update-time').textContent = '마지막 업데이트: ' + updateTime;

      // 지수/환율
      const indexes = data.filter(d => d.type === '지수' || d.type === '환율');
      const indexGrid = document.getElementById('sd-index-grid');
      if (indexes.length) {
        indexGrid.innerHTML = indexes.map(d => `
          <div class="sd-index-card">
            <div class="sd-index-label">${d.name}</div>
            <div class="sd-index-price">${fmt(d.price, d.type === '환율' ? 2 : 0)}</div>
            <div class="sd-index-change">${changeHtml(d.change, d.pct)}</div>
          </div>
        `).join('');
      } else {
        indexGrid.innerHTML = '<div class="sd-error">지수 데이터를 불러올 수 없습니다</div>';
      }

      // 종목
      const stocks = data.filter(d => d.type === '종목');
      const stockList = document.getElementById('sd-stock-list');
      if (stocks.length) {
        stockList.innerHTML = stocks.map(d => `
          <div class="sd-stock-row">
            <div>
              <div class="sd-stock-name">${d.name}</div>
            </div>
            <div class="sd-stock-right">
              <div class="sd-stock-price">${fmt(d.price, 0)}원</div>
              <div class="sd-stock-change">${changeHtml(d.change, d.pct)}</div>
            </div>
          </div>
        `).join('');
      } else {
        stockList.innerHTML = '<div class="sd-error">종목 데이터를 불러올 수 없습니다</div>';
      }

      // 티커
      const all = [...indexes, ...stocks];
      const tickerItems = all.map(d => {
        const up = d.change >= 0;
        const arrow = up ? '▲' : '▼';
        const cls = up ? 'sd-up' : 'sd-dn';
        return `<span>${d.name} ${fmt(d.price, d.type==='환율'?2:0)} <span class="${cls}">${arrow}${fmt(Math.abs(d.pct))}%</span></span>`;
      }).join('');
      document.getElementById('sd-ticker-inner').innerHTML = tickerItems + tickerItems;

    } catch(e) {
      document.getElementById('sd-index-grid').innerHTML = '<div class="sd-error">데이터를 불러올 수 없습니다. 잠시 후 다시 시도해주세요.</div>';
      document.getElementById('sd-ticker-inner').innerHTML = '<span>데이터 로드 실패 — 잠시 후 새로고침 해주세요</span>';
    }
  }

  function sd_bookmark() {
    alert('Ctrl+D (Mac: Cmd+D) 를 눌러 즐겨찾기에 추가하세요! 📌');
  }
  window.sd_bookmark = sd_bookmark;

  loadData();
  setInterval(loadData, 600000); // 10분마다 갱신
})();
</script>
