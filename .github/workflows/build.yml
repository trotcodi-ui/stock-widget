name: Build Electron App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: npx electron-packager . StockWidget --platform=win32 --arch=x64 --out=dist --overwrite

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: StockWidget-exe
          path: dist/StockWidget-win32-x64/
